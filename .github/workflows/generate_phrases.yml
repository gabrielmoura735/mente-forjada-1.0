name: Gerar Novas Frases Automaticamente (Cron Job)

on:
  schedule:
    # Roda à meia-noite do dia 1º, a cada 3 meses (Jan, Abr, Jul, Out)
    - cron: '0 0 1 */3 *'
  workflow_dispatch: # Permite que você clique em um botão no GitHub para rodar manualmente a qualquer momento

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para fazer push de volta pro repo

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Script Gerador de Frases da IA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate_ai_phrases.js

      - name: Salvar (Commit) e Enviar (Push) as alterações
        run: |
          git config --global user.name 'Mente Forjada [Bot]'
          git config --global user.email 'bot@menteforjada.com'
          git add principles.json
          git commit -m "chore(auto): geradas 300 novas frases automaticamente 🚀" || echo "Sem mudanças"
          git push
